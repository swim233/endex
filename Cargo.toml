[workspace]
resolver = "3"
members = ["crates/endex-core", "crates/endex-cli", "crates/endexd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
endex-core = { path = "crates/endex-core" }
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
