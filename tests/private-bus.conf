<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A private session bus for tests (the config file of `dbus-run-session`): like the standard
     session bus, but with no service directories, so nothing can be D-Bus activated on it.
     In particular not the installed endexd (~/.local/share/dbus-1/services), whatever
     XDG_DATA_HOME says. Tests start their own daemons. -->
<busconfig>
  <type>session</type>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
